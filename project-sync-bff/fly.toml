# fly.toml app configuration file generated for project-sync-sparkling-darkness-1999 on 2024-07-29T15:18:41-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'project-sync'
primary_region = 'iad'

[env]
  REDIS_HOST = 'redis-10817.c85.us-east-1-2.ec2.cloud.redislabs.com'
  REDIS_PORT = '10817'
  AWS_DEFAULT_REGION = 'us-east-2'
  PROJECT_BUCKET = 'rmt-projects'

[[mounts]]
  source = 'tmp'
  destination = '/tmp'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
