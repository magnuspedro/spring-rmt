spring:
  threads:
    virtual:
      enabled: true
  cloud:
    aws:
      credentials:
        instance-profile: false
      endpoint: ${LOCAL_STACK_HOST:http://127.0.0.1:4566}
      region:
        static: sa-east-1
      s3:
        path-style-access-enabled: true
  data:
    redis:
      host:  ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

s3:
  project-bucket: projects
  downloader-bucket: refactored-projects

rqueue:
  enabled: true

queue:
  detect-pattern: detect-pattern
  measure-pattern: measure-pattern

refactoring:
  # Default parallelism for all executors (can be overridden per-executor)
  default-parallelism: ${REFACTORING_DEFAULT_PARALLELISM:8}

  # Queue capacity for executor task queues (backpressure threshold)
  queue-capacity: ${REFACTORING_QUEUE_CAPACITY:100}

  # Executor-specific overrides
  executors:
    detection-methods-manager: ${REFACTORING_MANAGER_PARALLELISM:3}
    # cinneide, wei, zafeiris use default (8)

server:
  port: 8081
